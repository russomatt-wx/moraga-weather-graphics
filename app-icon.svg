<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Diablo Weather Lab app icon: the header mark (sunrise arc over twin peaks) on the site's night navy.
       No filters, so cairosvg (generate-app-icons workflow) renders it the same as browsers. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06315a"/>
      <stop offset=".55" stop-color="#031a30"/>
      <stop offset="1" stop-color="#020b17"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="760" r="560" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 760) scale(1 .62) translate(0 -760)">
      <stop offset="0" stop-color="#14b4ec" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#0b78b4" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0b78b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="512" cy="430" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19dcf6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#19dcf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cf6ff"/>
      <stop offset="1" stop-color="#0aa8de"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <!-- distant ridge with a glowing rim, as in the site header -->
  <path d="M0 842 L70 812 L128 828 L204 784 L262 806 L352 750 L428 790 L492 770 L574 812 L648 782 L742 822 L812 796 L896 830 L956 812 L1024 838 V1024 H0 Z" fill="#031426"/>
  <path d="M0 842 L70 812 L128 828 L204 784 L262 806 L352 750 L428 790 L492 770 L574 812 L648 782 L742 822 L812 796 L896 830 L956 812 L1024 838" fill="none" stroke="#19dcf6" stroke-opacity=".14" stroke-width="22" stroke-linejoin="round"/>
  <path d="M0 842 L70 812 L128 828 L204 784 L262 806 L352 750 L428 790 L492 770 L574 812 L648 782 L742 822 L812 796 L896 830 L956 812 L1024 838" fill="none" stroke="#3fe3ff" stroke-opacity=".85" stroke-width="4" stroke-linejoin="round"/>

  <!-- the mark (same geometry as the header logo, viewBox 160x84) -->
  <g transform="translate(152 292) scale(4.5)">
    <!-- the arc and peaks are clipped out behind the cloud so the background shows through it -->
    <clipPath id="cloudcut"><path clip-rule="evenodd" d="M-10 -10H170V94H-10Z M70 21H96A7 7 0 0 0 96 7A10 10 0 0 0 77 5A8 8 0 0 0 68 11A5 5 0 0 0 70 21Z"/></clipPath>
    <g clip-path="url(#cloudcut)">
    <!-- soft glow: wide translucent strokes under the shapes -->
    <path d="M74 40a32 32 0 0 1 64 0" fill="none" stroke="#19dcf6" stroke-opacity=".10" stroke-width="16" stroke-linecap="round"/>
    <path d="M2 80 58 30l22 17 30-30 48 63-50-40-28 25-22-15Z" fill="none" stroke="#19dcf6" stroke-opacity=".10" stroke-width="10" stroke-linejoin="round"/>
    <path d="M74 40a32 32 0 0 1 64 0" fill="none" stroke="#19dcf6" stroke-opacity=".16" stroke-width="9" stroke-linecap="round"/>
    <path d="M2 80 58 30l22 17 30-30 48 63-50-40-28 25-22-15Z" fill="none" stroke="#19dcf6" stroke-opacity=".16" stroke-width="5" stroke-linejoin="round"/>
    <!-- shapes -->
    <path d="M74 40a32 32 0 0 1 64 0" fill="none" stroke="url(#mark)" stroke-width="5" stroke-linecap="round"/>
    <path d="M2 80 58 30l22 17 30-30 48 63-50-40-28 25-22-15Z" fill="url(#mark)"/>
    </g>
    <!-- cloud outline (white, like the DIABLO wordmark) above the saddle, left of the sun -->
    <g transform="translate(62 -1)">
      <path d="M8 22H34A7 7 0 0 0 34 8A10 10 0 0 0 15 6A8 8 0 0 0 6 12A5 5 0 0 0 8 22Z" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
