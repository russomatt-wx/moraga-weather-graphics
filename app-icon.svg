<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Diablo Weather Lab app icon: the header mark (cloud and sunrise arc over faceted peaks) on the site's night navy.
       No filters, so cairosvg (generate-app-icons workflow) renders it the same as browsers. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06315a"/>
      <stop offset=".55" stop-color="#031a30"/>
      <stop offset="1" stop-color="#020b17"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="760" r="560" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 760) scale(1 .62) translate(0 -760)">
      <stop offset="0" stop-color="#14b4ec" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#0b78b4" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0b78b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="512" cy="430" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19dcf6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#19dcf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cf6ff"/>
      <stop offset="1" stop-color="#0aa8de"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <!-- distant ridge with a glowing rim, as in the site header -->
  <path d="M0 842 L70 812 L128 828 L204 784 L262 806 L352 750 L428 790 L492 770 L574 812 L648 782 L742 822 L812 796 L896 830 L956 812 L1024 838 V1024 H0 Z" fill="#031426"/>
  <path d="M0 842 L70 812 L128 828 L204 784 L262 806 L352 750 L428 790 L492 770 L574 812 L648 782 L742 822 L812 796 L896 830 L956 812 L1024 838" fill="none" stroke="#19dcf6" stroke-opacity=".14" stroke-width="22" stroke-linejoin="round"/>
  <path d="M0 842 L70 812 L128 828 L204 784 L262 806 L352 750 L428 790 L492 770 L574 812 L648 782 L742 822 L812 796 L896 830 L956 812 L1024 838" fill="none" stroke="#3fe3ff" stroke-opacity=".85" stroke-width="4" stroke-linejoin="round"/>

  <!-- the mark (same geometry as the header logo, viewBox 160x90) -->
  <g transform="translate(152 318) scale(4.5)">
<defs>
<linearGradient id="lt-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4feff"/><stop offset="1" stop-color="#8fe6ff"/></linearGradient>
<linearGradient id="dk-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd6f7"/><stop offset="1" stop-color="#0a9fd6"/></linearGradient>
<linearGradient id="arc-ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe9ff"/><stop offset="1" stop-color="#1ab8ee"/></linearGradient>
<radialGradient id="cl-ic" gradientUnits="userSpaceOnUse" cx="52" cy="13" r="36" gradientTransform="translate(52 13) scale(1 .62) translate(-52 -13)"><stop offset="0" stop-color="#3f5064"/><stop offset=".5" stop-color="#617286"/><stop offset=".8" stop-color="#a9b7c7"/><stop offset="1" stop-color="#f2f6fb"/></radialGradient>
<linearGradient id="hi-ic" gradientUnits="userSpaceOnUse" x1="60" y1="-12" x2="56" y2="10"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<path d="M84.75 8.33A37.02 37.02 0 0 1 141 46.77" fill="none" stroke="#19dcf6" stroke-opacity=".14" stroke-width="9" stroke-linecap="round"/>
<path d="M84.75 8.33A37.02 37.02 0 0 1 141 46.77" fill="none" stroke="url(#arc-ic)" stroke-width="4" stroke-linecap="round"/>
<path d="M2 80 58 30 58 50Z" fill="url(#lt-ic)"/>
<path d="M58 30 80 47 80 65 58 50Z" fill="#79dcf8"/>
<path d="M80 47 110 17 108 40 80 65Z" fill="url(#lt-ic)"/>
<path d="M110 17 158 80 108 40Z" fill="url(#dk-ic)"/>
<path d="M34 23.3A10.4 10.4 0 0 1 37.12 2.98A7 7 0 0 1 46.2 2.4A14.3 14.3 0 0 1 74.79 2.04A10.8 10.8 0 0 1 77.5 23.3Z" fill="none" stroke="#cdeeff" stroke-opacity=".07" stroke-width="7" stroke-linejoin="round"/><path d="M34 23.3A10.4 10.4 0 0 1 37.12 2.98A7 7 0 0 1 46.2 2.4A14.3 14.3 0 0 1 74.79 2.04A10.8 10.8 0 0 1 77.5 23.3Z" fill="none" stroke="#cdeeff" stroke-opacity=".12" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M34 23.3A10.4 10.4 0 0 1 37.12 2.98A7 7 0 0 1 46.2 2.4A14.3 14.3 0 0 1 74.79 2.04A10.8 10.8 0 0 1 77.5 23.3Z" fill="url(#cl-ic)"/>
<path d="M34 23.3A10.4 10.4 0 0 1 37.12 2.98A7 7 0 0 1 46.2 2.4A14.3 14.3 0 0 1 74.79 2.04A10.8 10.8 0 0 1 77.5 23.3Z" fill="url(#hi-ic)"/>
<path d="M34 23.3A10.4 10.4 0 0 1 37.12 2.98A7 7 0 0 1 46.2 2.4A14.3 14.3 0 0 1 74.79 2.04A10.8 10.8 0 0 1 77.5 23.3Z" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width=".8" stroke-linejoin="round"/>
  </g>
</svg>
