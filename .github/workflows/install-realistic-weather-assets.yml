name: Install realistic weather assets
on:
  push:
    paths:
      - '.github/workflows/install-realistic-weather-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract WebP assets and replace stock photo renderer
        shell: bash
        run: |
          set -euo pipefail
          unzip -o moraga_weather_realistic_assets.zip 'weather-assets/*.webp' -d .
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          start=s.find('const iconSvg=(kind)=>{')
          end=s.find('\nconst labelLower=condition[1].toLowerCase();',start)
          if start<0 or end<0:
              raise SystemExit('Cannot locate forecast icon renderer; refusing unsafe edit')
          replacement="""const iconSvg=(kind)=>{
            const weatherAssets={sun:'sun',mostlySun:'mostlySun',partly:'partly',clearing:'clearing',cloud:'cloud',showers:'showers',rain:'rain',drizzle:'drizzle',storm:'storm',fog:'fog',snow:'cloud'};
            const name=weatherAssets[kind]||'partly';
            return '<img class="forecast-wx-icon forecast-realistic" src="weather-assets/'+name+'.webp" alt="" aria-hidden="true" loading="lazy" decoding="async">';
          };"""
          s=s[:start]+replacement+s[end:]
          s=s.replace('</head>',"""<style>
          /* Photorealistic transparent WebP weather artwork, mobile first. */
          #ten-day .day-condition>span{height:110px!important;overflow:visible!important;border-radius:0!important;display:flex;align-items:center;justify-content:center}
          #ten-day .forecast-wx-icon.forecast-realistic{display:block!important;object-fit:contain!important;object-position:center!important;width:100%!important;max-width:155px!important;height:110px!important;filter:none!important;border-radius:0!important;margin:auto}
          @media(max-width:760px){#ten-day .day-condition>span{height:88px!important}#ten-day .forecast-wx-icon.forecast-realistic{height:88px!important;max-width:100%!important}}
          </style></head>""")
          p.write_text(s)
          for k in ['sun','mostlySun','partly','cloud','rain','showers','drizzle','clearing','fog','storm']:
              assert Path('weather-assets/'+k+'.webp').is_file(), k
          assert 'forecast-realistic' in s and "images.unsplash.com" not in s, 'stock photo references remain'
          print('Verified 10 WebP files and forecast references')
          PY
      - name: Commit assets and HTML
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html weather-assets/*.webp
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Deploy photorealistic transparent WebP weather icons"
            git push
          fi
