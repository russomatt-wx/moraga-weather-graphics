name: Render GFS PWAT maps
on:
  workflow_dispatch:
  schedule:
    - cron: '45 2,8,14,20 * * *'
permissions:
  contents: write
concurrency:
  group: gfs-pwat
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/gfs_pwat.py
      - run: pip install herbie-data 'numpy<2' matplotlib cartopy cfgrib eccodes
      - run: python scripts/gfs_pwat.py
      - name: Publish validated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs_pwat_f012.png gfs_pwat_f036.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh GFS PWAT maps"
            git pull --rebase origin main
            git push
          fi
