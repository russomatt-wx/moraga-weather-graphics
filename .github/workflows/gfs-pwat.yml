name: Render GFS PWAT maps
on:
  push:
    paths:
      - 'scripts/gfs_pwat.py'
      - '.github/workflows/gfs-pwat.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 2,11,16,21 * 3-10 *'
    - cron: '10 3,12,17,22 * 11,12,1,2 *'
permissions:
  contents: write
concurrency:
  group: gfs-pwat
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/gfs_pwat.py
      - run: pip install herbie-data 'numpy<2' matplotlib cartopy cfgrib eccodes
      - run: python scripts/gfs_pwat.py
      - name: Publish validated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs_pwat_f012.png gfs_pwat_f036.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh GFS PWAT maps"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
