name: Moraga 14-day rainfall graphic
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rainfall_10day.py'
      - 'scripts/public_short_range.py'
      - 'scripts/validate_forecast_publish.py'
      - '.github/workflows/rainfall_10day.yml'
  schedule:
    # Every three hours in UTC; DST-independent and off the top of the hour.
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moraga-rainfall-forecast-publish
  cancel-in-progress: false
jobs:
  rainfall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install matplotlib requests
      - run: python scripts/rainfall_10day.py
      - name: Validate forecast before publishing
        run: python scripts/validate_forecast_publish.py
      - name: Commit published graphic and data with safe retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/moraga-rainfall-publish
          cp moraga_rainfall_10day.png moraga_rainfall_10day.json moraga_forecast_10day.json /tmp/moraga-rainfall-publish/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/moraga-rainfall-publish/* ./
            git add moraga_rainfall_10day.png moraga_rainfall_10day.json moraga_forecast_10day.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update rolling 10-day forecast and 14-day rainfall'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish rainfall and forecast after five attempts' >&2
          exit 1
