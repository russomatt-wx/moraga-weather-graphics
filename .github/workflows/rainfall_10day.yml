name: Moraga 14-day rainfall graphic
on:
  push:
    paths:
      - 'scripts/rainfall_10day.py'
      - 'scripts/public_short_range.py'
      - 'scripts/validate_forecast_publish.py'
      - '.github/workflows/rainfall_10day.yml'
  schedule:
    # Every three hours in UTC; DST-independent and off the top of the hour.
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moraga-rainfall-forecast-publish
  cancel-in-progress: false
jobs:
  rainfall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - run: python scripts/rainfall_10day.py
      - name: Collect Lafayette Danville and Greenbrook model blends in isolated directories
        shell: bash
        run: |
          set -euo pipefail
          for location in lafayette danville greenbrook; do
            mkdir -p "/tmp/wx-${location}"
            if [ "$location" = lafayette ]; then lat=37.890; lon=-122.115; elif [ "$location" = greenbrook ]; then lat=37.799; lon=-121.970; else lat=37.813; lon=-121.974; fi
            (cd "/tmp/wx-${location}" && WX_FORECAST_LAT="$lat" WX_FORECAST_LON="$lon" WX_FORECAST_OUTPUT="${location}_forecast_10day.json" python "$GITHUB_WORKSPACE/scripts/rainfall_10day.py")
            cp "/tmp/wx-${location}/${location}_forecast_10day.json" ./
          done
      - name: Collect 24-hour short-range model blends
        run: python scripts/public_short_range.py
      - name: Validate forecast before publishing
        run: python scripts/validate_forecast_publish.py
      - name: Commit published graphic and data with safe retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/moraga-rainfall-publish
          cp moraga_rainfall_10day.png moraga_rainfall_10day.json moraga_forecast_10day.json lafayette_forecast_10day.json danville_forecast_10day.json greenbrook_forecast_10day.json /tmp/moraga-rainfall-publish/
          for f in *_short_range_24h.json; do [ ! -f \"$f\" ] || cp \"$f\" /tmp/moraga-rainfall-publish/; done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/moraga-rainfall-publish/* ./
            git add moraga_rainfall_10day.png moraga_rainfall_10day.json moraga_forecast_10day.json lafayette_forecast_10day.json danville_forecast_10day.json greenbrook_forecast_10day.json
            for f in *_short_range_24h.json; do [ ! -f \"$f\" ] || git add \"$f\"; done
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update rolling 10-day forecast and 14-day rainfall'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish rainfall and forecast after five attempts' >&2
          exit 1
