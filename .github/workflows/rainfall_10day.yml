name: Moraga 10-day rainfall graphic
on:
  schedule:
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rainfall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - run: python scripts/rainfall_10day.py
      - name: Commit published graphic and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moraga_rainfall_10day.png moraga_rainfall_10day.json
          git diff --cached --quiet || (git commit -m "Update 10-day Moraga rainfall model comparison" && git push)
