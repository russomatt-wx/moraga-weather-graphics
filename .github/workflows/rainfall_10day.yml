name: Moraga 14-day rainfall graphic
on:
  push:
    paths:
      - 'scripts/rainfall_10day.py'
      - '.github/workflows/rainfall_10day.yml'
  schedule:
    - cron: '10 2,11,16,21 * 3-10 *'
    - cron: '10 3,12,17,22 * 11,12,1,2 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moraga-rainfall-forecast-publish
  cancel-in-progress: false
jobs:
  rainfall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib
      - run: python scripts/rainfall_10day.py
      - name: Commit published graphic and data with safe retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/moraga-rainfall-publish
          cp moraga_rainfall_10day.png moraga_rainfall_10day.json moraga_forecast_10day.json /tmp/moraga-rainfall-publish/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/moraga-rainfall-publish/* ./
            git add moraga_rainfall_10day.png moraga_rainfall_10day.json moraga_forecast_10day.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update rolling 10-day forecast and 14-day rainfall [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish rainfall and forecast after five attempts' >&2
          exit 1
