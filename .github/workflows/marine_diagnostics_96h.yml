name: Moraga marine diagnostics (96h)
on:
  push:
    paths:
      - 'scripts/marine_diagnostics_96h.py'
      - '.github/workflows/marine_diagnostics_96h.yml'
  schedule:
    - cron: '25 1,7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marine-diagnostics-graphics
  cancel-in-progress: false
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install matplotlib numpy requests
      - name: Generate actual model diagnostics
        run: python scripts/marine_diagnostics_96h.py
      - name: Publish images and data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/marine-publish
          cp moraga_pressure_gradient_96h.png moraga_marine_layer_proxy_96h.png moraga_marine_diagnostics_96h.json /tmp/marine-publish/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/marine-publish/* .
            python - <<'PY'
            import json
            from pathlib import Path
            p=Path("index.html")
            html=p.read_text() if p.exists() else "<h1>Moraga weather graphics</h1>"
            for filename,heading in [("moraga_pressure_gradient_96h.png","48h pressure gradient + 48h forecast"),("moraga_marine_layer_proxy_96h.png","Coastal boundary-layer proxy: model history + forecast")]:
                if filename not in html:
                    html += f'<h2>{heading}</h2><p><img width="900" src="{filename}" alt="{heading}"></p>'
            p.write_text(html)
            m=Path("manifest.json")
            data=json.loads(m.read_text()) if m.exists() else {}
            data.update({"pressure_gradient_chart":"moraga_pressure_gradient_96h.png","marine_layer_proxy_chart":"moraga_marine_layer_proxy_96h.png","marine_diagnostics_data":"moraga_marine_diagnostics_96h.json"})
            m.write_text(json.dumps(data,indent=2)+chr(10))
            PY
            git add index.html manifest.json moraga_pressure_gradient_96h.png moraga_marine_layer_proxy_96h.png moraga_marine_diagnostics_96h.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update Moraga marine pressure and PBL proxy charts"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
