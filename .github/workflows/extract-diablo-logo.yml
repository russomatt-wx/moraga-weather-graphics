name: Extract original Diablo logo (one time)
on:
  push:
    paths:
      - .github/workflows/extract-diablo-logo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy
      - run: python scripts/extract_diablo_logo.py
      - name: Publish transparent image only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diablo-original-transparent.png
          git diff --cached --quiet || (git commit -m "Generate transparent logo from original uploaded artwork" && git push)
