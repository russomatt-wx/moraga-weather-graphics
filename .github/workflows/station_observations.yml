name: Publish KCAMORAG71 daily summary
on:
  push:
    paths:
      - 'scripts/station_today.py'
      - '.github/workflows/station_observations.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: station-daily-summary
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build daily summary from verified station archive
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: python3 scripts/station_today.py
      - name: Commit updated summary
        run: |
          set -euo pipefail
          cp moraga_station_today.json /tmp/moraga_station_today.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/moraga_station_today.json moraga_station_today.json
            git add moraga_station_today.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh daily KCAMORAG71 high low rainfall"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
