name: Render KCAMORAG71 observations
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
concurrency:
  group: station-observations
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install matplotlib numpy
      - name: Render verified PWS observations
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/station_observations.py
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moraga_station_observations.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh redesigned KCAMORAG71 station observations"
            git pull --rebase origin main
            git push
          fi
