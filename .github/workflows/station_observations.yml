name: Render KCAMORAG71 observations
on:
  push:
    paths:
      - 'scripts/station_observations.py'
      - '.github/workflows/station_observations.yml'
  workflow_dispatch:
  schedule:
    - cron: '0,30 * * * *'
permissions:
  contents: write
concurrency:
  group: station-observations
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache chart dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: station-chart-pip-${{ runner.os }}-py311-matplotlib-numpy-v1
      - run: pip install matplotlib numpy
      - name: Render verified Xweather archive observations
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: python scripts/station_observations.py
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moraga_station_observations.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh redesigned KCAMORAG71 station observations"
            git pull --rebase origin main
            git push
          fi
