name: Coordinated weather site publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coordinated-pages.yml'
      - '*.json'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.svg'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'station-dashboard.html'
      - 'app.webmanifest'
      - 'app-icon.svg'
      - 'app-icon-180.png'
      - 'app-icon-192.png'
      - 'app-icon-512.png'
      - 'service-worker.js'
      - '.github/workflows/station_observations.yml'
  schedule:
    # Hourly publication to include the latest station summary, plus pre-briefing runs.
    - cron: '35 * * * *'
    # Publish ahead of the four Pacific briefings; UTC schedule follows PDT/PST seasons.
    - cron: '30 3,12,17,22 * 3-10 *'
    - cron: '30 4,13,18,23 * 11,12,1,2 *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coordinated-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest weather graphics
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build station summary from latest Xweather archive
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: |
          python3 scripts/station_today.py
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          d=json.loads(Path('moraga_station_today.json').read_text())
          last=datetime.fromisoformat(d['last_observation_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-last).total_seconds()/60
          print(f"Station summary observation age: {age:.1f} minutes")
          if age>90:
              raise SystemExit(f"Refusing stale station summary: {age:.0f} minutes old")
          f=Path('moraga_forecast_10day.json')
          if f.exists():
              forecast=json.loads(f.read_text())
              print('Forecast generated:',forecast.get('generated_utc'))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
