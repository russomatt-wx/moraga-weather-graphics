name: Coordinated weather site publication
on:
  workflow_dispatch:
  schedule:
    # One coordinated publication per hour; also available via manual dispatch.
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coordinated-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest weather graphics
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build station summary from latest Xweather archive
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: |
          python3 scripts/station_today.py
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          d=json.loads(Path('moraga_station_today.json').read_text())
          last=datetime.fromisoformat(d['last_observation_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-last).total_seconds()/60
          print(f"Station summary observation age: {age:.1f} minutes")
          if age>90:
              print(f"::warning::Station observation is {age:.0f} minutes old; publishing forecast with delayed-observation indicator")
          f=Path('moraga_forecast_10day.json')
          if f.exists():
              forecast=json.loads(f.read_text())
              print('Forecast generated:',forecast.get('generated_utc'))
          PY
      - name: Refresh public climate ledger from private source
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          url = "https://api.github.com/repos/russomatt-wx/moraga-weather/contents/climate/ledger_latest.json"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["WEATHER_REPO_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "MoragaWeatherObservatory"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          ledger = json.loads(base64.b64decode(data["content"]))
          from datetime import datetime, timezone, timedelta
          stamp = datetime.fromisoformat(ledger["generated_utc"].replace("Z", "+00:00"))
          if datetime.now(timezone.utc) - stamp > timedelta(hours=36):
              raise RuntimeError("Private climate ledger is stale; refusing to publish old observations")
          Path("climate_ledger_latest.json").write_text(json.dumps(ledger, indent=2) + chr(10))
          print("Refreshed climate ledger", ledger["generated_utc"])
          PY
      - name: Commit refreshed public station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moraga_station_today.json climate_ledger_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified public station observations [skip ci]"
            git push
          fi
      - name: Validate forecast files without blocking publication
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          for name in ('moraga_forecast_10day.json', 'moraga_rainfall_10day.json'):
              path = Path(name)
              if not path.exists():
                  print(f'::warning::{name} is missing from this deployment')
                  continue
              data = json.loads(path.read_text())
              stamp = datetime.fromisoformat(data['generated_utc'].replace('Z', '+00:00'))
              age = (datetime.now(timezone.utc) - stamp).total_seconds() / 3600
              print(f'{name}: generated {stamp.isoformat()}, age {age:.1f} hours')
              if age > 3:
                  print(f'::warning::{name} is {age:.1f} hours old')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
