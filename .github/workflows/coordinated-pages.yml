name: Coordinated weather site publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coordinated-pages.yml'
      - 'moraga_extended_outlook.json'
  schedule:
    # Publish a fresh site after the four daily forecast cycles (UTC).
    - cron: '25 4,13,18,23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coordinated-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest weather graphics
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
