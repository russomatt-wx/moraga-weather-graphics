name: Coordinated weather site publication
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Moraga 14-day rainfall graphic']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'moraga_forecast_10day.json'
      - 'moraga_rainfall_10day.json'
      - 'moraga_rainfall_10day.png'
      - 'index.html'
      - 'pacific_synoptic.png'
      - 'pacific_synoptic.json'
      - 'service-worker.js'
      - '.github/workflows/coordinated-pages.yml'
  schedule:
    # Staggered publication opportunities after the private :07/:37 collector.
    # Push events also publish new forecasts without waiting for the clock.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coordinated-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest weather graphics
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Recover missed private Xweather collector schedule
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          token=os.environ.get('WEATHER_REPO_TOKEN','')
          if not token:
              print('::warning::Missing WEATHER_REPO_TOKEN; collector recovery unavailable')
              raise SystemExit(0)
          base='https://api.github.com/repos/russomatt-wx/moraga-weather'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'MoragaWeatherObservatory'}
          def get_latest():
              req=urllib.request.Request(base+'/contents/observations/KCAMORAG71_'+datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d')+'.csv',headers=headers)
              with urllib.request.urlopen(req,timeout=20) as response:
                  obj=json.load(response)
              lines=base64.b64decode(obj['content']).decode().splitlines()
              return datetime.fromisoformat(lines[-1].split(',')[1].replace('Z','+00:00')) if len(lines)>1 else None
          now=datetime.now(timezone.utc)
          try:
              latest=get_latest()
          except Exception as e:
              print('Unable to read private archive freshness:',type(e).__name__)
              latest=None
          if latest and now-latest<timedelta(minutes=65):
              print('Collector is fresh; no recovery dispatch needed:',latest)
              raise SystemExit(0)
          print('Collector stale; dispatching private recovery workflow. Latest:',latest)
          payload=json.dumps({'ref':'main'}).encode()
          req=urllib.request.Request(base+'/actions/workflows/collect-xweather.yml/dispatches',data=payload,headers={**headers,'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  print('Recovery dispatched:',response.status)
          except urllib.error.HTTPError as e:
              print('::warning::Recovery dispatch rejected (HTTP '+str(e.code)+'); WEATHER_REPO_TOKEN needs Actions:write on private repo')
              raise
          # Give the private collector time to finish before generating the public summary.
          for attempt in range(12):
              time.sleep(10)
              try:
                  new=get_latest()
                  if new and (not latest or new>latest):
                      print('Recovered observation:',new)
                      break
              except Exception as e:
                  print('Recovery polling:',type(e).__name__)
          else:
              print('::warning::Collector dispatched but no newer archived observation yet; retaining last valid data')
          PY
      - name: Build station summary from latest Xweather archive
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: |
          python3 scripts/station_today.py
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          d=json.loads(Path('moraga_station_today.json').read_text())
          last=datetime.fromisoformat(d['last_observation_utc'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-last).total_seconds()/60
          print(f"Station summary observation age: {age:.1f} minutes")
          if age>90:
              print(f"::warning::Station observation is {age:.0f} minutes old; publishing forecast with delayed-observation indicator")
          f=Path('moraga_forecast_10day.json')
          if f.exists():
              forecast=json.loads(f.read_text())
              print('Forecast generated:',forecast.get('generated_utc'))
          PY
      - name: Refresh public climate ledger from private source
        continue-on-error: true
        env:
          WEATHER_REPO_TOKEN: ${{ secrets.WEATHER_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          url = "https://api.github.com/repos/russomatt-wx/moraga-weather/contents/climate/ledger_latest.json"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["WEATHER_REPO_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "MoragaWeatherObservatory"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          ledger = json.loads(base64.b64decode(data["content"]))
          from datetime import datetime, timezone, timedelta
          stamp = datetime.fromisoformat(ledger["generated_utc"].replace("Z", "+00:00"))
          if datetime.now(timezone.utc) - stamp > timedelta(hours=36):
              raise RuntimeError("Private climate ledger is stale; refusing to publish old observations")
          Path("climate_ledger_latest.json").write_text(json.dumps(ledger, indent=2) + chr(10))
          print("Refreshed climate ledger", ledger["generated_utc"])
          PY
      - name: Commit refreshed public station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moraga_station_today.json climate_ledger_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified public station observations [skip ci]"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              echo "Station data push conflict; retry $attempt"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep $((attempt * 2))
            done
            exit 1
          fi
      - name: Validate forecast files without blocking publication
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          for name in ('moraga_forecast_10day.json', 'moraga_rainfall_10day.json'):
              path = Path(name)
              if not path.exists():
                  print(f'::warning::{name} is missing from this deployment')
                  continue
              data = json.loads(path.read_text())
              stamp = datetime.fromisoformat(data['generated_utc'].replace('Z', '+00:00'))
              age = (datetime.now(timezone.utc) - stamp).total_seconds() / 3600
              print(f'{name}: generated {stamp.isoformat()}, age {age:.1f} hours')
              if age > 3:
                  print(f'::warning::{name} is {age:.1f} hours old')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
