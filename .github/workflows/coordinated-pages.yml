name: Coordinated weather site publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coordinated-pages.yml'
      - '*.json'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.svg'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'station-dashboard.html'
      - 'app.webmanifest'
      - 'app-icon.svg'
      - 'app-icon-180.png'
      - 'app-icon-192.png'
      - 'app-icon-512.png'
      - 'service-worker.js'
  schedule:
    # Publish ahead of the four Pacific briefings; UTC schedule follows PDT/PST seasons.
    - cron: '30 3,12,17,22 * 3-10 *'
    - cron: '30 4,13,18,23 * 11,12,1,2 *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coordinated-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest weather graphics
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
