name: Coordinated weather site publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coordinated-pages.yml'
      - 'moraga_extended_outlook.json'
  schedule:
    # Publish before the four Pacific briefing times (6 AM, 11 AM, 4 PM, 9 PM).
    # Seasonal UTC schedules target 5:30, 10:30, 15:30, and 20:30 Pacific.
    - cron: '30 3,12,17,22 * 3-10 *' # PDT season
    - cron: '30 4,13,18,23 * 11,12,1,2 *' # PST season
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: coordinated-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest weather graphics
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
