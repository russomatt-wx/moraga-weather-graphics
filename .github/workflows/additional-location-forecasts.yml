name: Additional locations 10-day forecasts
on:
  workflow_dispatch:
  schedule:
    # Twice daily: 02:37 and 14:37 UTC (6:37 AM/PM PST; 7:37 AM/PM PDT).
    - cron: '37 2,14 * * *'
permissions:
  contents: write
concurrency:
  group: additional-location-forecasts
  cancel-in-progress: false
jobs:
  locations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install matplotlib requests
      - name: Collect additional locations
        shell: bash
        run: |
          set -euo pipefail
          # Every location in locations.json except Moraga (which has its own forecast pipeline).
          python3 -c "import json;[print(l['id'],l['lat'],l['lon']) for l in json.load(open('locations.json'))['locations'] if l['id']!='moraga']" > /tmp/locs.txt
          while read -r location lat lon; do
            mkdir -p "/tmp/wx-$location"
            # Let the script compare against the current feed (it keeps it if a new run lost models).
            cp "./${location}_forecast_10day.json" "/tmp/wx-$location/" 2>/dev/null || true
            (cd "/tmp/wx-$location" && WX_FORECAST_LAT="$lat" WX_FORECAST_LON="$lon" WX_FORECAST_OUTPUT="${location}_forecast_10day.json" python "$GITHUB_WORKSPACE/scripts/rainfall_10day.py") || echo "::warning::$location forecast failed"
            cp "/tmp/wx-$location/${location}_forecast_10day.json" "./${location}_forecast_10day.json" 2>/dev/null || true
          done < /tmp/locs.txt
      - name: Validate independent location forecasts
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          from zoneinfo import ZoneInfo
          today=datetime.datetime.now(ZoneInfo('America/Los_Angeles')).date()
          dates=[(today+datetime.timedelta(days=i)).isoformat() for i in range(10)]
          locs=[(l['id'],l['lat'],l['lon']) for l in json.load(open('locations.json'))['locations'] if l['id']!='moraga']
          for name,lat,lon in locs:
              data=json.loads(pathlib.Path(f'{name}_forecast_10day.json').read_text())
              assert data['dates']==dates, f'{name}: wrong dates'
              assert abs(data['latitude']-lat)<0.002 and abs(data['longitude']-lon)<0.002, f'{name}: wrong coordinates'
              assert len(data.get('temperature_models',{}))>=2, f'{name}: insufficient models'
              assert all(day in data.get('rain_guidance',{}) for day in dates), f'{name}: missing rain guidance'
              print(name,'validated')
          PY
      - name: Publish only additional location feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/additional-location-publish
          cp $(python3 -c "import json;print(' '.join(l['id']+'_forecast_10day.json' for l in json.load(open('locations.json'))['locations'] if l['id']!='moraga'))") /tmp/additional-location-publish/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/additional-location-publish/* ./
            git add *_forecast_10day.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh twice-daily additional location forecasts'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
