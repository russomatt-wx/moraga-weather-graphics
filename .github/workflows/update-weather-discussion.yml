name: Update Weather Discussion

# Gemini-written Moraga weather discussion -> public/weather-discussion.json.
# Needs the GEMINI_API_KEY repository secret (Settings -> Secrets and variables -> Actions).
on:
  schedule:
    # ~6 AM PT (14 UTC) and ~5 PM PT (01 UTC) in standard time; an hour later during daylight time.
    # Minute 7, not 0: GitHub often skips schedules on the hour.
    - cron: '7 14,1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-discussion
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Gen AI SDK
        run: pip install google-genai

      - name: Generate weather discussion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate_discussion.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/weather-discussion.json
          git diff --staged --quiet && exit 0
          git commit -m "Update weather discussion"
          # Other jobs push to main all day: rebase and retry instead of failing on a race.
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
