name: Pacific Storm Tracker ECMWF AI and IFS maps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_storm_ecmwf.py'
      - '.github/workflows/storm-ecmwf.yml'
permissions:
  contents: write
concurrency:
  group: storm-ecmwf
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ecmwf-opendata eccodes numpy matplotlib cartopy scipy
      - name: Generate actual ECMWF AI and IFS maps
        run: python scripts/build_storm_ecmwf.py
      - name: Publish generated maps
        run: |
          set -euo pipefail
          cp -r storm_maps /tmp/storm_maps
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p storm_maps
            cp -r /tmp/storm_maps/. storm_maps/
            git add storm_maps/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish verified ECMWF AIFS and IFS Pacific maps'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
