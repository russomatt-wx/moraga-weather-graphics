name: Publish local Weather Outlook synopses
on:
  workflow_dispatch:
  schedule:
    # 6 AM and 3 PM America/Los_Angeles year-round; UTC duplicates are gated below.
    - cron: '17 13,14,22,23 * * *'
permissions:
  contents: write
concurrency:
  group: local-weather-outlook-publication
  cancel-in-progress: false
jobs:
  publish-outlooks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check local publication window
        id: gate
        run: |
          HOUR="$(TZ=America/Los_Angeles date +%H)"
          if [ "$HOUR" = "06" ] || [ "$HOUR" = "15" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Publishing local outlooks at $(TZ=America/Los_Angeles date)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC schedule outside 6 AM / 3 PM Pacific."
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Generate all location synopses
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-weather-outlooks.js
      - name: Verify generated local Weather Outlook feed
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          feed=json.loads(Path('weather_outlooks.json').read_text())
          locations=json.loads(Path('locations.json').read_text())['locations']
          stamp=datetime.fromisoformat(feed['generated_utc'].replace('Z','+00:00'))
          age=datetime.now(timezone.utc)-stamp
          if age < timedelta(minutes=-10) or age > timedelta(minutes=15):
              raise SystemExit(f'Generated feed timestamp is not current: {age}')
          expected={x.get('outlook_key') or x['key'] for x in locations}
          actual=set(feed.get('outlooks',{}))
          if actual != expected:
              raise SystemExit(f'Incomplete feed: {len(actual)}/{len(expected)} locations; missing={sorted(expected-actual)}')
          temperature=re.compile(r'\b\d{2,3}\s*°\s*F?\b',re.I)
          offenders=[key for key,item in feed['outlooks'].items() if temperature.search(item.get('headline','')+' '+item.get('text',''))]
          if offenders:
              raise SystemExit('Explicit temperatures remain in synopses: '+', '.join(offenders))
          print(f'Verified temperature-free synopses for all {len(actual)} locations')
          PY
      - name: Commit refreshed outlook feed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather_outlooks.json
          if git diff --cached --quiet; then echo "Outlook feed is unchanged."; exit 0; fi
          git commit -m "Publish local Weather Outlook synopses"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
