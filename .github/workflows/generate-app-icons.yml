name: Generate iPhone app icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-app-icons.yml'
      - 'app-icon.svg'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render PNG icons from existing SVG artwork
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (180,192,512):
              cairosvg.svg2png(url="app-icon.svg",write_to=f"app-icon-{size}.png",output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-icon-180.png app-icon-192.png app-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Add PNG app icons for iOS and Android"
            git pull --rebase origin main
            git push
          fi
