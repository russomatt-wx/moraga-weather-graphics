<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1422"><title>RRFS | Diablo Weather Lab · Observation Lab</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf3ff;background:#0a1422;color-scheme:dark}
body{max-width:960px;margin:auto;padding:26px 18px;line-height:1.5}a{color:#80d4ff}.sub{color:#a9bed1}
article{background:#142438;border:1px solid #30455b;border-radius:18px;padding:22px;margin:18px 0}
h1{font-size:clamp(28px,5vw,42px);margin:12px 0}h2{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
svg{width:100%;height:230px;overflow:visible}svg text{font-family:inherit;fill:#a9bed1;font-size:12px}.grid article{min-width:0}#rain-note{color:#9bb6cd;font-size:14px;margin:0}button{background:#21354b;color:#eaf3ff;border:1px solid #4c6884;padding:8px 16px;border-radius:18px;cursor:pointer}
button[aria-pressed=true]{border-color:#7dd3fc;background:#24506c}
#status{color:#f4d8a9}small{color:#9bb6cd}
</style>
<a href="./index.html">← Observation Lab</a>
<p class="sub">SHORT-RANGE MODEL INTELLIGENCE</p><h1>RRFS | 48 Hours</h1>
<p class="sub">48-hour temperature and rainfall forecast for Moraga.</p>
<article><strong id="status">Checking RRFS source…</strong><p id="detail" class="sub"></p><small id="cycle"></small></article>
<div class="grid">
<article><h2>Temperature · °F</h2><svg id="temp" viewBox="0 0 440 230" role="img" aria-label="RRFS hourly temperature chart"></svg></article>
<article><h2>Hourly rainfall · inches</h2><svg id="rain" viewBox="0 0 440 230" role="img" aria-label="RRFS hourly precipitation chart"></svg><p id="rain-note"></p></article>
</div>
<article><h2>48-hour rainfall total</h2><p id="totals" class="sub">Awaiting forecast data.</p></article>
<script>
const base='./hrrr-data/';
let rows=[],horizon=48;
const $=id=>document.getElementById(id);
function parseCSV(s){const lines=s.trim().split(/\r?\n/),head=lines.shift().split(',');return lines.map(line=>Object.fromEntries(line.split(',').map((v,i)=>[head[i],v])));}
function render(){
 const selected=rows.slice(0,horizon),t=selected.map(x=>Number(x.temperature_2m)),p=selected.map(x=>Number(x.precipitation));
 const ns='http://www.w3.org/2000/svg',fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',hour12:true});
 const add=(svg,tag,attrs,content)=>{const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(content!==undefined)el.textContent=content;svg.append(el);return el};
 function chart(id,vals,color,bars=false){
  const svg=$(id);svg.replaceChildren();
  if(!vals.length||vals.some(v=>!Number.isFinite(v))){add(svg,'text',{x:220,y:115,'text-anchor':'middle'},'Forecast unavailable');return}
  const dry=bars&&Math.max(...vals)<=0;
  const min=bars?0:Math.floor((Math.min(...vals)-2)/5)*5;
  const max=bars?Math.max(0.05,Math.max(...vals)*1.2):Math.ceil((Math.max(...vals)+2)/5)*5;
  const x=i=>47+i*370/Math.max(vals.length-1,1),y=v=>190-(v-min)/(max-min)*155;
  for(let k=0;k<5;k++){const v=min+(max-min)*k/4,yy=y(v);add(svg,'line',{x1:47,x2:420,y1:yy,y2:yy,stroke:'#40536a','stroke-dasharray':'3 5'});add(svg,'text',{x:40,y:yy+4,'text-anchor':'end'},bars?v.toFixed(2):Math.round(v)+'°')}
  [0,Math.floor((vals.length-1)/2),vals.length-1].forEach(i=>{const dt=new Date(selected[i].valid_time_utc+'Z');add(svg,'text',{x:x(i),y:217,'text-anchor':i===0?'start':i===vals.length-1?'end':'middle'},fmt.format(dt))});
  if(dry){add(svg,'text',{x:230,y:105,'text-anchor':'middle',fill:'#9bb6cd'},'No precipitation forecast');return}
  if(bars){vals.forEach((v,i)=>{if(v>0)add(svg,'rect',{x:x(i)-3,y:y(v),width:Math.max(3,370/vals.length-2),height:190-y(v),fill:color})})}
  else {
   add(svg,'path',{d:vals.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' '),fill:'none',stroke:color,'stroke-width':3,'stroke-linecap':'round'});
   const high=Math.max(...vals),low=Math.min(...vals),hi=vals.indexOf(high),lo=vals.indexOf(low);
   // Mark the next local calendar day at its first hourly forecast point.
   const dayFmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',weekday:'short',month:'short',day:'numeric'});
   const dayKey=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'});
   let lastDay=dayKey.format(new Date(selected[0].valid_time_utc+'Z'));
   selected.forEach((row,i)=>{
    const dt=new Date(row.valid_time_utc+'Z'),key=dayKey.format(dt);
    if(key!==lastDay){
      const xx=x(i);
      add(svg,'line',{x1:xx,x2:xx,y1:35,y2:190,stroke:'#6b8da8','stroke-width':1.2,'stroke-dasharray':'4 5',opacity:0.8});
      add(svg,'text',{x:Math.min(xx+7,360),y:27,fill:'#b8d5ed','font-weight':'700'},dayFmt.format(dt));
      lastDay=key;
    }
   });
   for(const [i,v,label,fill] of [[hi,high,'High','#ffbd75'],[lo,low,'Low','#80c9f7']]){
    add(svg,'circle',{cx:x(i),cy:y(v),r:5,fill,stroke:'#142438','stroke-width':2});
    const nearRight=x(i)>340,nearLeft=x(i)<105;
    const tx=nearRight?x(i)-9:nearLeft?x(i)+9:x(i);
    const anchor=nearRight?'end':nearLeft?'start':'middle';
    const ty=label==='High'?Math.max(17,y(v)-13):Math.min(188,y(v)+21);
    add(svg,'text',{x:tx,y:ty,'text-anchor':anchor,fill,'font-weight':'700'},label+' '+Math.round(v)+'°');
   }
  }
 }
 chart('temp',t,'#ffbb77');chart('rain',p,'#58bff2',true);
 const total=p.reduce((a,b)=>a+b,0);
 $('rain-note').textContent=total===0?'Dry throughout the selected forecast window.':'Hourly bars show forecast rainfall, not observations.';
 $('totals').textContent=total.toFixed(2)+' in forecast over 48 hours';
}
(async()=>{
 try{
 const response=await fetch(base+'short_range_metadata.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Verified RRFS data has not yet been published');
 const m=await response.json();
 if(m.status!=='available'||m.source_verified!==true)throw Error(m.reason||'Model initialization and independence not verified');
 if(m.source_model!=='ncep_rrfs_conus')throw Error('Unexpected model source');
 if(Date.now()-Date.parse(m.retrieved_utc)>9*3600000)throw Error('RRFS collection is stale');
 const r=await fetch(base+'short_range.csv?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('forecast unavailable');
 const all=parseCSV(await r.text()),now=Date.now();
 rows=all.filter(x=>Date.parse(x.valid_time_utc.endsWith('Z')?x.valid_time_utc:x.valid_time_utc+'Z')>=now && Number.isFinite(Number(x.temperature_2m)) && Number.isFinite(Number(x.precipitation))).slice(0,48);
 if(rows.length<24)throw Error('Fewer than 24 valid forecast hours');
 $('status').textContent='Verified RRFS forecast';$('status').style.color='#9ee6c4';
 $('detail').textContent='Raw model forecast · 48 hours';
 $('cycle').textContent='Updated '+new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',dateStyle:'medium',timeStyle:'short'}).format(new Date(m.retrieved_utc))+' Pacific';
 render();
 }catch(e){$('status').textContent='RRFS forecast temporarily unavailable';$('detail').textContent=e.message+' — independent model guidance is required before publication.';$('cycle').textContent='No substitute forecast is displayed.';}
})();
</script></html>
